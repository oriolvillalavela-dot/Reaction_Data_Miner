[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "surf_extractor"
version = "0.1.0"
description = "Multi-agent LLM pipeline for standardizing chemical reaction data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "rdkit>=2023.03.3",
    "pdfplumber>=0.10.0",
    "python-dotenv",
    "httpx",
    "python-multipart"
]

[project.optional-dependencies]
dev = ["pytest", "black", "isort", "jupyter"]

[tool.black]
line-length = 88
